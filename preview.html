<script>
  // Every uncaught error and rejection is recorded and rendered into
  // #errors at the end of the run, so `--dump-dom` sees them. A headless
  // screenshot cannot show a thrown ReferenceError: the tab just renders
  // empty or half-built, which reads as a styling problem. This is how a
  // missing import in src/ surfaces as an actual failure instead.
  window.__FLAME_ERRORS__ = [];
  window.addEventListener('error', (e) => {
    window.__FLAME_ERRORS__.push(`${e.message} @ ${e.filename}:${e.lineno}`);
  });
  window.addEventListener('unhandledrejection', (e) => {
    window.__FLAME_ERRORS__.push(`unhandled rejection: ${e.reason && e.reason.message || e.reason}`);
  });
  const __origError = console.error.bind(console);
  console.error = (...args) => {
    window.__FLAME_ERRORS__.push(args.map(String).join(' '));
    __origError(...args);
  };
</script>

<script>
  // Both seeds need a slot that is genuinely inside the portal's 24h
  // release window *right now*, or the runner correctly refuses it for a
  // reason that has nothing to do with what is being tested. Hardcoding
  // "1 PM today" only worked while the harness was run before 1 PM;
  // after that it silently became a "the slot already started" failure.
  // Search the gym's own 6 AM-2 PM window across today and tomorrow for
  // the first hour that is still ahead and less than 24h out.
  function firstOpenGymSlot() {
    const pad = (n) => String(n).padStart(2, '0');
    const now = Date.now();
    for (const dayOffset of [0, 1]) {
      for (let hour = 6; hour < 14; hour++) {
        const d = new Date();
        d.setDate(d.getDate() + dayOffset);
        d.setHours(hour, 0, 0, 0);
        const delta = d - now;
        if (delta <= 0 || delta >= 24 * 60 * 60 * 1000) continue;
        const h12 = ((hour + 11) % 12) + 1;
        return {
          date: `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`,
          startTime: `${h12}:00 ${hour < 12 ? 'AM' : 'PM'}`,
          endTime: `${((hour + 12) % 12) + 1}:00 ${hour + 1 < 12 ? 'AM' : 'PM'}`,
        };
      }
    }
    return null;
  }

  // ?seed=twin plants two already-open intents for the same resource class
  // on the same day — the shape that scheduleIntent now refuses up front,
  // but that can still be sitting in localStorage from before that rule
  // existed. Exercises runAutoBook's own guard rather than the UI's.
  const seed = new URLSearchParams(location.search).get('seed');
  // ?auth=<good|stale|none> controls what the previous session left behind.
  // The stub short-circuits the network, so this exercises the storage and
  // retry logic rather than a real handshake.

      await wait(700);
      const root = document.getElementById('flame-reskin-root');
      const out = [];
      const seen = new Set();
      let scanned = 0;
      for (const node of root.querySelectorAll('*')) {
        // Only elements rendering text directly: a container's rects are
        // its children's, and would double-report every finding.
        const texts = [...node.childNodes].filter((n) => n.nodeType === 3 && n.textContent.trim());
        if (!texts.length) continue;
        scanned++;
        const range = document.createRange();
        range.selectNodeContents(node);
        const tops = new Set([...range.getClientRects()].filter((r) => r.width > 0).map((r) => Math.round(r.top)));
        if (tops.size < 2) continue;
        const cls = node.className && node.className.baseVal === undefined
          ? `.${String(node.className).trim().split(/\s+/).join('.')}`
          : node.tagName.toLowerCase();
        const planned = WRAP_OK.some((sel) => node.matches(sel));
        const line = `${planned ? 'ok  ' : 'WRAP'} ${tops.size} lines  ${cls}  ${node.textContent.trim().slice(0, 46)}`;
        if (seen.has(line)) continue;
        seen.add(line);
        out.push(line);
      }
      // The other half of the assertion: white-space:nowrap turns a wrap
      // into an overflow, so a clean wrap report on its own proves
      // nothing. Anything wider than its own box is a finding unless the
      // box scrolls on purpose (the week grid does, and says so in CSS).
      for (const node of root.querySelectorAll('*')) {
        if (node.scrollWidth <= node.clientWidth + 1) continue;
        // Only overflow-x:visible actually spills. hidden/clip is the
        // ellipsis doing its job (an ellipsised line always measures wider
        // than its box), and auto/scroll is a container that scrolls on
        // purpose — the week grid, and .fr-content itself.
        if (getComputedStyle(node).overflowX !== 'visible') continue;
        const cls = node.className && node.className.baseVal === undefined
          ? `.${String(node.className).trim().split(/\s+/).join('.')}`
          : node.tagName.toLowerCase();
        out.push(`WRAP overflow ${node.scrollWidth}>${node.clientWidth}  ${cls}  ${node.textContent.trim().slice(0, 40)}`);
      }
      if (document.documentElement.scrollWidth > window.innerWidth + 1) {
        out.push(`WRAP page scrolls sideways: ${document.documentElement.scrollWidth} > ${window.innerWidth}`);
      }

      const bad = out.filter((l) => l.startsWith('WRAP'));
      const pre = document.createElement('pre');
      pre.id = 'measure';
      // scanned is reported so "0 unplanned" can be told apart from
      // "the page never rendered and there was nothing to check".
      pre.textContent = (bad.length ? bad.join('\n') : 'no unplanned wrapping') +
        `\n-- ${bad.length} unplanned, ${out.length - bad.length} planned, ${scanned} text runs scanned`;
      document.body.appendChild(pre);
    }
    if (auto === 'cancel-confirm' || auto === 'cancel-measure') {
      await wait(400);
      document.querySelector('.fr-cancel-wrap .fr-btn--ghost').click(); // Cancel -> asks
    }
    if (auto === 'cancel-measure') {
      // Same dump as ?auto=measure, but with one row's confirmation open —
      // the case where a row is most likely to grow taller than its peers.
      await wait(300);
      const out = [];
      document.querySelectorAll('.fr-row').forEach((n, i) => {
        const label = (n.querySelector('.fr-row-title') || n).textContent.trim().slice(0, 34);
        out.push(`.fr-row[${i}] ${Math.round(n.getBoundingClientRect().height)}px  ${label}`);
      });
      const pre = document.createElement('pre');
      pre.id = 'measure';
      pre.textContent = out.join('\n');
      document.body.appendChild(pre);
    }
  });
</script>
</body>
</html>
