<script>
  // QA-harness only: scripted click-throughs for states that need real
  // interaction (slot selection, confirm panel, cancel confirm), driven by
  // ?auto=<scenario> since the screenshot CLI tool can't click anything itself.
  window.addEventListener('load', async () => {
    const auto = new URLSearchParams(location.search).get('auto');
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    if (auto === 'book-confirm') {
      await wait(400); // availability now auto-loads, just wait for it then pick a slot
      document.querySelector('.fr-slot:not(:disabled)').click();
    }
    if (auto === 'week') {
      await wait(200);
      [...document.querySelectorAll('.fr-view-toggle button')].find((b) => b.textContent === 'Week').click();
    }
    if (auto === 'week-scrolled') {
      await wait(200);
      [...document.querySelectorAll('.fr-view-toggle button')].find((b) => b.textContent === 'Week').click();
      await wait(200);
      document.querySelector('.fr-content').scrollTop = 999;
    }
    if (auto === 'pick-thu') {
      await wait(300);
      [...document.querySelectorAll('.fr-datestrip-cell')]
        .find((c) => c.querySelector('.fr-datestrip-daynum')?.textContent === '3')
        .click();
    }
    if (auto === 'toggle-off') {
      await wait(200);
      document.getElementById('flame-reskin-toggle').click();
    }
    if (auto === 'cancel-confirm') {
      await wait(400);
      document.querySelector('.fr-cancel-wrap .fr-btn--ghost').click(); // Cancel -> asks
    }
  });
</script>
